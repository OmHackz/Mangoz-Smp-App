name: Android APK

# Builds a release ARM64 APK. Supabase credentials come from GitHub Secrets
# (repo Settings → Secrets and variables → Actions):
#   SUPABASE_URL       e.g. https://xyz.supabase.co
#   SUPABASE_ANON_KEY  your Supabase anon / publishable key
#
# Nothing is committed to the repo: .env is gitignored and recreated here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # NEW STEP: Generate the .env file using GitHub Secrets
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Analyze
        run: dart analyze

      # NOTE: no --target-platform on purpose. An ARM64-only build ships
      # just arm64-v8a native libs and crashes on 32-bit ARM devices
      # (Could not find 'libflutter.so'). The default fat APK covers
      # armeabi-v7a + arm64-v8a + x86_64.
      - name: Build APK (all ABIs)
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangoz-smp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
